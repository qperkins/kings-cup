name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t ghcr.io/${{ github.repository_owner }}/kings-cup-backend:latest \
            -t ghcr.io/${{ github.repository_owner }}/kings-cup-backend:${{ github.sha }} \
            .

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd /opt/kings-cup-backend
            IMAGE=ghcr.io/${{ github.repository_owner }}/kings-cup-backend:latest ./scripts/deploy.sh
